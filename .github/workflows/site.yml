name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No personal email in commits (E1-S1-2)
        if: github.event_name == 'pull_request'
        run: |
          allowed='(@users\.noreply\.github\.com|^noreply@github\.com|^noreply@anthropic\.com|@heveliusai\.com)$'
          bad=$(git log --format='%ae%n%ce' "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" | sort -u | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::Commits use an address that is not a no-reply or company address: $bad"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate HTML (E1-S1-1)
        run: npm run validate

      - run: npx playwright install --with-deps chromium

      - name: Accessibility, layout, content and speed checks
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Publishes site/ to GitHub Pages. Skipped while the repository is private;
  # it starts working once the site's repository is public and Pages is set to "GitHub Actions".
  # "Run workflow" on main (Actions tab) also publishes, without needing a new commit.
  deploy:
    needs: checks
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers keep styles.css and site.js for a while. Naming this release in their
      # addresses makes every visitor load the files that match the page they got.
      - name: Tie the stylesheet and script to this release
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|; s|src=\"site.js\"|src=\"site.js?v=$v\"|" site/index.html
          grep -q "styles.css?v=$v" site/index.html && grep -q "site.js?v=$v" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
